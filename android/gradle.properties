org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 2.4 + Gradle 9 on Windows intermittently fails to release its
# incremental-compilation cache files ("Could not close incremental caches"),
# which breaks compileDebugKotlin for the plugin modules. Disabling incremental
# Kotlin compilation is the standard workaround; it costs a little rebuild time
# and nothing else. Retry removing this after a Kotlin toolchain upgrade.
kotlin.incremental=false
